<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime-Z AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #1e293b; padding: 15px 20px; text-align: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.2rem; color: #a855f7; letter-spacing: 1px; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background-color: #a855f7; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }

    #input-container { padding: 15px; background-color: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
    #message-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; }
    #message-input:focus { border-color: #a855f7; }
    
    button { padding: 12px 20px; background-color: #a855f7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #9333ea; }
  </style>
</head>
<body>

  <header>
    <h1>PRIME-Z AI</h1>
  </header>

  <div id="chat-container">
    <div class="message bot">Hello! I am Prime-Z AI. How can I assist you today?</div>
  </div>

  <div id="input-container">
    <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // Paste your OpenRouter API key inside the quotes below
    const OPENROUTER_API_KEY = "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";

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const botMsgDiv = appendMessage('Thinking...', 'bot');

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
            'Content-Type': 'json'
          },
          body: JSON.stringify({
            model: 'meta-llama/llama-3.1-8b-instruct:free',
            messages: [{ role: 'user', content: text }]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "Sorry, I couldn't fetch a response.";
        botMsgDiv.textContent = reply;
      } catch (err) {
        botMsgDiv.textContent = "Error connecting to AI. Please check your API key.";
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }
  </script>

</body>
    </html>
